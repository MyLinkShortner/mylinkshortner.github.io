<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>TOONZI Secure Gateway • Almost Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* ============================================ */
        /* RESET & BASE                                */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ============================================ */
        /* MAIN WRAPPER                                */
        /* ============================================ */
        .main-wrapper {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            overflow-x: hidden;
        }

        /* ============================================ */
        /* TOP BANNER - TOONZI                         */
        /* ============================================ */
        .top-banner {
            background: #0f172a;
            padding: 12px 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
            border-bottom: 3px solid #ffcc00;
            width: 100%;
            max-width: 100%;
        }

        .top-banner .brand {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .top-banner .brand span {
            color: #ffcc00;
        }

        .top-banner .tagline {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
            display: block;
            margin-top: 2px;
            letter-spacing: 2px;
        }

        /* ============================================ */
        /* AD CONTAINERS                               */
        /* ============================================ */
        .ad-container {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eef2f6;
            padding: 12px 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            width: 100%;
            overflow: hidden;
            margin: 0 auto;
        }

        .ad-label {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            background: #f1f5f9;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            margin-bottom: 8px;
        }

        .ad-container iframe,
        .ad-container ins {
            max-width: 100% !important;
            width: 100% !important;
            height: auto !important;
        }

        /* ============================================ */
        /* MAIN CONTAINER                              */
        /* ============================================ */
        .container {
            background: white;
            border-radius: 0 0 24px 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            border-top: none;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .title span {
            color: #ffcc00;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: 800;
            color: #27ae60;
            margin: 20px 0;
            line-height: 1;
        }

        .progress-bg {
            background: #e2e8f0;
            height: 10px;
            border-radius: 20px;
            margin: 20px 0;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: 1s linear;
            border-radius: 20px;
        }

        .status-msg {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        /* ============================================ */
        /* BUTTON                                      */
        /* ============================================ */
        .btn-getlink {
            background: #cbd5e1;
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            display: inline-block;
            cursor: not-allowed;
            pointer-events: none;
            transition: 0.3s;
            border: none;
            font-family: 'Inter', sans-serif;
            width: 100%;
            max-width: 320px;
        }

        .btn-getlink.active {
            background: #27ae60;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 12px 25px rgba(39, 174, 96, 0.3);
        }

        .btn-getlink.active:hover {
            transform: scale(1.02);
        }

        /* ============================================ */
        /* BOTTOM AD                                   */
        /* ============================================ */
        .ad-bottom {
            margin-top: 20px;
        }

        /* ============================================ */
        /* RESPONSIVE                                  */
        /* ============================================ */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                border-radius: 0 0 20px 20px;
            }

            .timer-display {
                font-size: 4rem;
            }

            .ad-container {
                padding: 8px 6px;
            }

            .top-banner .brand {
                font-size: 18px;
            }

            .top-banner .tagline {
                font-size: 10px;
            }

            .btn-getlink {
                font-size: 1rem;
                padding: 14px 30px;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
                border-radius: 0 0 16px 16px;
            }

            .title {
                font-size: 1.4rem;
            }

            .timer-display {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .status-msg {
                font-size: 0.8rem;
            }

            .btn-getlink {
                font-size: 0.9rem;
                padding: 12px 20px;
            }

            .ad-label {
                font-size: 0.5rem;
                padding: 2px 8px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 18px 12px;
            }

            .timer-display {
                font-size: 2.5rem;
            }

            .title {
                font-size: 1.2rem;
            }

            .btn-getlink {
                font-size: 0.8rem;
                padding: 10px 16px;
            }
        }

        /* Ensure all ads are responsive */
        img, iframe, ins {
            max-width: 100% !important;
            height: auto !important;
        }

        .wrapper, .container, .ad-container, .main-wrapper {
            max-width: 100%;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">

        <!-- ========================================== -->
        <!-- TOP BANNER - TOONZI                       -->
        <!-- ========================================== -->
        <div class="top-banner">
            <div class="brand">TOON<span>ZI</span></div>
            <div class="tagline">Secure Gateway • Final Step</div>
        </div>

        <!-- ========================================== -->
        <!-- BANNER AD - 468x60                        -->
        <!-- ========================================== -->
        <div class="ad-container" style="border-radius:0;border-top:none;border-bottom:none;">
            <div class="ad-label">📢 Advertisement</div>
            <div style="display:flex;justify-content:center;">
                <ins style="width:468px;height:60px" data-width="468" data-height="60" class="cb94ded8f97" data-domain="//data527.click" data-affquery="/3d58b808f0e7b71a5760/b94ded8f97/?placementName=Banner">
                    <script src="//data527.click/js/responsive.js" async></script>
                </ins>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MAIN CONTAINER                             -->
        <!-- ========================================== -->
        <div class="container">
            <div class="title">🔐 Almost <span>Ready</span></div>
            <div class="subtitle">Preparing your secure destination...</div>
            
            <div class="timer-display" id="timer">10</div>
            <div class="progress-bg">
                <div class="progress-fill" id="fill"></div>
            </div>
            
            <div class="status-msg" id="statusMsg">Finalizing security • 10 seconds</div>
            
            <a href="#" id="getLinkBtn" class="btn-getlink">⏳ PLEASE WAIT...</a>
        </div>

        <!-- ========================================== -->
        <!-- REDIRECT AD - Below Container             -->
        <!-- ========================================== -->
        <div class="ad-container ad-bottom" style="border-radius:0 0 20px 20px;border-top:none;">
            <div class="ad-label">📢 Advertisement</div>
            <!-- Redirect Ad -->
            <script type="text/javascript" src="//data527.click/22f69e47002b9e54b28f/7688ab137a/?placementName=default"></script>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- FIREBASE & JAVASCRIPT                     -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABekPzR4zxlY8rws16hyYNmFlMXBcggXk",
            authDomain: "vansh-98953.firebaseapp.com",
            projectId: "vansh-98953",
            storageBucket: "vansh-98953.firebasestorage.app",
            messagingSenderId: "784796743834",
            appId: "1:784796743834:web:b4ca65fc00f6ce50ff0723"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');
        
        let targetUrl = null;
        let linkDocRef = null;
        let linkDataFull = null;
        let time = 10;
        
        const timerEl = document.getElementById('timer');
        const fillEl = document.getElementById('fill');
        const btn = document.getElementById('getLinkBtn');
        const statusMsg = document.getElementById('statusMsg');

        // ============================================
        // GET DEVICE INFO
        // ============================================
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = 'Desktop', browser = 'Unknown';
            if (/(iPhone|iPad|iPod)/i.test(ua)) device = 'iOS';
            else if (/Android/i.test(ua)) device = 'Android';
            else if (/Windows/i.test(ua)) device = 'Windows';
            else if (/Mac/i.test(ua)) device = 'Mac';
            else if (/Linux/i.test(ua)) device = 'Linux';
            
            if (/Edg/i.test(ua)) browser = 'Edge';
            else if (/OPR|Opera/i.test(ua)) browser = 'Opera';
            else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = 'Chrome';
            else if (/Firefox/i.test(ua)) browser = 'Firefox';
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
            else if (/SamsungBrowser/i.test(ua)) browser = 'Samsung';
            
            return { device, browser };
        }

        // ============================================
        // GET LOCATION INFO
        // ============================================
        async function getLocationInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return { 
                    country: data.country_name || 'Unknown', 
                    city: data.city || 'Unknown', 
                    ip: data.ip || 'Unknown' 
                };
            } catch (e) { 
                return { country: 'Unknown', city: 'Unknown', ip: 'Unknown' }; 
            }
        }

        // ============================================
        // SAVE CLICK ANALYTICS
        // ============================================
        async function saveClickAnalytics(linkIdValue, userId) {
            try {
                const deviceInfo = getDeviceInfo();
                const locationInfo = await getLocationInfo();
                
                const analyticsData = {
                    linkId: linkIdValue,
                    userId: userId,
                    clickedAt: new Date().toISOString(),
                    device: deviceInfo.device,
                    browser: deviceInfo.browser,
                    country: locationInfo.country,
                    city: locationInfo.city,
                    ip: locationInfo.ip,
                    referrer: document.referrer || 'Direct'
                };
                
                await addDoc(collection(db, "analytics"), analyticsData);
                return true;
            } catch (error) { 
                console.warn("Analytics log:", error); 
                return false; 
            }
        }

        // ============================================
        // FETCH LINK
        // ============================================
        async function fetchLink() {
            if (!linkId) {
                showError('No link ID provided.');
                return;
            }
            
            try {
                const docRef = doc(db, "links", linkId);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    linkDataFull = docSnap.data();
                    targetUrl = linkDataFull.longUrl;
                    linkDocRef = docRef;
                    checkLinkStatus();
                    return;
                }
                
                const linksRef = collection(db, "links");
                const q = query(linksRef, where("shortId", "==", linkId));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const docSnap = querySnapshot.docs[0];
                    linkDataFull = docSnap.data();
                    targetUrl = linkDataFull.longUrl;
                    linkDocRef = doc(db, "links", docSnap.id);
                    checkLinkStatus();
                    return;
                }
                
                showError('Link not found.');
            } catch (e) { 
                showError('Connection error. Please try again.'); 
            }
        }

        // ============================================
        // CHECK LINK STATUS
        // ============================================
        function checkLinkStatus() {
            if (linkDataFull.retracted === true) { 
                showError('This link has been retracted.'); 
                return; 
            }
            
            if (linkDataFull.expiryDate && new Date(linkDataFull.expiryDate) < new Date()) { 
                showError('This link has expired.'); 
                return; 
            }
            
            startTimer();
        }

        // ============================================
        // START TIMER
        // ============================================
        function startTimer() {
            const countdown = setInterval(() => {
                time--;
                timerEl.innerText = time;
                const progress = ((10 - time) / 10) * 100;
                fillEl.style.width = progress + "%";
                
                if (time <= 3 && time > 0) {
                    statusMsg.innerHTML = "✅ Almost ready...";
                }
                
                if (time <= 0) {
                    clearInterval(countdown);
                    timerEl.innerText = "0";
                    fillEl.style.width = "100%";
                    statusMsg.innerHTML = "🎉 Ready! Click below to continue.";
                    btn.innerHTML = "🔓 GET LINK";
                    btn.classList.add('active');
                }
            }, 1000);
        }

        // ============================================
        // UPDATE CLICK & REDIRECT
        // ============================================
        async function updateClickAndRedirect() {
            if (!targetUrl) return;
            
            btn.innerHTML = "⏳ Redirecting...";
            btn.style.opacity = "0.7";
            btn.classList.remove('active');
            
            try {
                await updateDoc(linkDocRef, { 
                    clicks: increment(1), 
                    lastClicked: new Date().toISOString() 
                });
                
                await saveClickAnalytics(linkId, linkDataFull.userId);
                
                Swal.fire({ 
                    icon: 'success',
                    title: 'Success!', 
                    text: 'Redirecting...', 
                    showConfirmButton: false, 
                    timer: 1000 
                });
                
                setTimeout(() => {
                    window.location.href = targetUrl.startsWith('http') ? targetUrl : 'https://' + targetUrl;
                }, 1000);
                
            } catch (error) {
                try { 
                    await saveClickAnalytics(linkId, linkDataFull.userId); 
                } catch (e) {}
                
                setTimeout(() => {
                    window.location.href = targetUrl.startsWith('http') ? targetUrl : 'https://' + targetUrl;
                }, 500);
            }
        }

        // ============================================
        // SHOW ERROR
        // ============================================
        function showError(message) {
            document.querySelector('.container').innerHTML = `
                <div class="title" style="color:#e74c3c;">❌ Error</div>
                <p style="margin:20px 0;color:#64748b;">${message}</p>
                <a href="javascript:history.back()" style="display:inline-block;padding:12px 28px;background:#0f172a;color:white;border-radius:12px;text-decoration:none;font-weight:600;">← Go Back</a>
            `;
        }

        // ============================================
        // BUTTON CLICK
        // ============================================
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            if (btn.classList.contains('active') && targetUrl) {
                updateClickAndRedirect();
            }
        });

        // ============================================
        // KEYBOARD SHORTCUT: Enter
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (btn.classList.contains('active') && targetUrl) {
                    updateClickAndRedirect();
                }
            }
        });

        // ============================================
        // INIT
        // ============================================
        fetchLink();

    </script>

</body>
</html>
