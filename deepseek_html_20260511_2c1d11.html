<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Almost Ready • MyLinkShortner</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Monetag Multi Ads -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="231085" async data-cfasync="false"></script>
    <style>
        :root { --primary: #2563eb; --secondary: #10b981; --dark: #0f172a; --text: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: var(--dark); line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 28px; padding: 50px 30px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 25px 40px -12px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .title { font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 8px; }
        .subtitle { font-size: 0.95rem; color: #64748b; margin-bottom: 30px; }
        .timer-display { font-size: 5rem; font-weight: 800; color: var(--secondary); margin: 20px 0; line-height: 1; }
        .progress-bg { background: #e2e8f0; height: 10px; border-radius: 20px; margin: 20px 0; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--secondary); transition: 1s linear; border-radius: 20px; }
        .btn-getlink { background: #cbd5e1; color: white; padding: 18px 45px; border-radius: 50px; font-weight: 700; font-size: 1.2rem; text-decoration: none; display: inline-block; cursor: not-allowed; pointer-events: none; transition: 0.3s; border: none; }
        .btn-getlink.active { background: var(--secondary); cursor: pointer; pointer-events: auto; box-shadow: 0 12px 25px rgba(16,185,129,0.3); }
        .btn-getlink.active:hover { transform: scale(1.03); }
        .monetag-zone { min-height: 60px; background: #f1f5f9; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 20px 0; border: 1px dashed #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">🔐 Almost Ready</div>
        <div class="subtitle">Preparing your secure destination...</div>
        
        <!-- Monetag Ad Zone -->
        <div class="monetag-zone">
            <span style="color: #94a3b8; font-size: 0.75rem;">SPONSORED</span>
        </div>
        
        <div class="timer-display" id="timer">10</div>
        <div class="progress-bg"><div class="progress-fill" id="fill"></div></div>
        
        <p id="status-msg" style="color: #64748b; margin-bottom: 25px; font-size: 0.9rem;">Finalizing security • 10 seconds</p>
        
        <a href="#" id="getLinkBtn" class="btn-getlink">⏳ PLEASE WAIT...</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABekPzR4zxlY8rws16hyYNmFlMXBcggXk",
            authDomain: "vansh-98953.firebaseapp.com",
            projectId: "vansh-98953",
            storageBucket: "vansh-98953.firebasestorage.app",
            messagingSenderId: "784796743834",
            appId: "1:784796743834:web:b4ca65fc00f6ce50ff0723"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');
        
        let targetUrl = null;
        let linkDocRef = null;
        let linkDataFull = null;
        let time = 10;
        
        const timerEl = document.getElementById('timer');
        const fillEl = document.getElementById('fill');
        const btn = document.getElementById('getLinkBtn');
        const statusMsg = document.getElementById('status-msg');

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = 'Desktop', browser = 'Unknown';
            if (/(iPhone|iPad|iPod)/i.test(ua)) device = 'iOS';
            else if (/Android/i.test(ua)) device = 'Android';
            else if (/Windows/i.test(ua)) device = 'Windows';
            else if (/Mac/i.test(ua)) device = 'Mac';
            else if (/Linux/i.test(ua)) device = 'Linux';
            if (/Edg/i.test(ua)) browser = 'Edge';
            else if (/OPR|Opera/i.test(ua)) browser = 'Opera';
            else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = 'Chrome';
            else if (/Firefox/i.test(ua)) browser = 'Firefox';
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
            else if (/SamsungBrowser/i.test(ua)) browser = 'Samsung';
            return { device, browser };
        }

        async function getLocationInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return { country: data.country_name || 'Unknown', city: data.city || 'Unknown', ip: data.ip || 'Unknown' };
            } catch (e) { return { country: 'Unknown', city: 'Unknown', ip: 'Unknown' }; }
        }

        async function saveClickAnalytics(linkIdValue, userId) {
            try {
                const deviceInfo = getDeviceInfo();
                const locationInfo = await getLocationInfo();
                const analyticsData = {
                    linkId: linkIdValue,
                    userId: userId,
                    clickedAt: new Date().toISOString(),
                    device: deviceInfo.device,
                    browser: deviceInfo.browser,
                    country: locationInfo.country,
                    city: locationInfo.city,
                    ip: locationInfo.ip,
                    referrer: document.referrer || 'Direct'
                };
                await addDoc(collection(db, "analytics"), analyticsData);
                return true;
            } catch (error) { console.warn("Analytics log:", error); return false; }
        }

        async function fetchLink() {
            if (!linkId) {
                showError('No link ID provided.');
                return;
            }
            try {
                const docRef = doc(db, "links", linkId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    linkDataFull = docSnap.data();
                    targetUrl = linkDataFull.longUrl;
                    linkDocRef = docRef;
                    checkLinkStatus();
                    return;
                }
                const linksRef = collection(db, "links");
                const q = query(linksRef, where("shortId", "==", linkId));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    const docSnap = querySnapshot.docs[0];
                    linkDataFull = docSnap.data();
                    targetUrl = linkDataFull.longUrl;
                    linkDocRef = doc(db, "links", docSnap.id);
                    checkLinkStatus();
                    return;
                }
                showError('Link not found.');
            } catch (e) { showError('Connection error.'); }
        }

        function checkLinkStatus() {
            if (linkDataFull.retracted === true) { showError('Link has been retracted.'); return; }
            if (linkDataFull.expiryDate && new Date(linkDataFull.expiryDate) < new Date()) { showError('Link has expired.'); return; }
            startTimer();
        }

        function startTimer() {
            const countdown = setInterval(() => {
                time--;
                timerEl.innerText = time;
                fillEl.style.width = ((10 - time) / 10 * 100) + "%";
                
                if (time <= 3 && time > 0) {
                    statusMsg.innerHTML = "✅ Almost ready...";
                }
                
                if (time <= 0) {
                    clearInterval(countdown);
                    timerEl.innerText = "0";
                    statusMsg.innerHTML = "🎉 Ready! Click below to continue.";
                    btn.innerHTML = "🔓 GET LINK";
                    btn.classList.add('active');
                }
            }, 1000);
        }

        async function updateClickAndRedirect() {
            if (!targetUrl) return;
            btn.innerHTML = "⏳ Redirecting...";
            btn.style.opacity = "0.7";
            btn.classList.remove('active');
            
            try {
                await updateDoc(linkDocRef, { clicks: increment(1), lastClicked: new Date().toISOString() });
                await saveClickAnalytics(linkId, linkDataFull.userId);
                
                Swal.fire({ title: 'Success!', text: 'Redirecting to your destination...', icon: 'success', showConfirmButton: false, timer: 1000 });
                setTimeout(() => {
                    window.location.href = targetUrl.startsWith('http') ? targetUrl : 'https://' + targetUrl;
                }, 1000);
            } catch (error) {
                try { await saveClickAnalytics(linkId, linkDataFull.userId); } catch (e) {}
                setTimeout(() => {
                    window.location.href = targetUrl.startsWith('http') ? targetUrl : 'https://' + targetUrl;
                }, 500);
            }
        }

        function showError(message) {
            document.querySelector('.container').innerHTML = `
                <div class="title">❌ Error</div>
                <p style="margin:20px 0;">${message}</p>
                <a href="javascript:history.back()" style="display:inline-block;padding:12px 24px;background:#2563eb;color:white;border-radius:12px;text-decoration:none;">← Go Back</a>
            `;
        }

        btn.addEventListener('click', function(e) {
            e.preventDefault();
            if (btn.classList.contains('active') && targetUrl) {
                updateClickAndRedirect();
            }
        });

        fetchLink();
    </script>
</body>
</html>
